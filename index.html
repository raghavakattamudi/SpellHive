<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpellHive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one centred column, a honey header band, chunky game buttons, a hex hive as the progress map. Single light theme by choice. */
  color-scheme: light;
  --ink:#1F2340;
  --paper:#FFFBEA;
  --card:#FFFFFF;
  --honey:#FFC629;
  --amber:#B86200;
  --good:#1B8553;
  --bad:#C93A30;
  --line:#E6DCB8;
  --muted:#5D6079;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.4rem}h3{font-size:1.1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.band{background:var(--honey);border-bottom:3px solid var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
main.wrap{display:flex;flex-direction:column;gap:16px;padding-bottom:48px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.brand h1 span{font-size:1.6rem}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.center{align-items:center;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center .row{justify-content:center}
.btn{background:var(--honey);border:2px solid var(--ink);border-radius:14px;padding:10px 20px;font-family:var(--display);font-weight:800;font-size:1.15rem;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--card)}
.btn.small{font-size:.95rem;padding:6px 14px;box-shadow:0 3px 0 var(--ink)}
.btn.danger{background:var(--card);color:var(--bad);border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.chip{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.chip:hover{background:var(--honey)}
.link{background:none;border:0;padding:4px;font-weight:700;text-decoration:underline;cursor:pointer}
.muted{color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:16px;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:4px}
.mode.main{background:var(--honey)}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mode b{font-family:var(--display);font-size:1.3rem}
.mode span{font-size:.95rem}
.hive{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:30px;height:34px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line)}
.cell.b1{background:#F0A29B}.cell.b2{background:#FFE694}.cell.b3{background:var(--honey)}.cell.b4,.cell.b5{background:var(--amber)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend .cell{width:16px;height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:.9rem;background:var(--paper)}
.badge b{display:block;font-family:var(--display)}
.badge.off{opacity:.45;border-style:dashed}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.player{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800}
.player i{font-style:normal;font-size:2.4rem}
.av{font-size:1.5rem;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 8px;cursor:pointer}
.av.on{border-color:var(--ink);background:var(--honey)}
input[type=text],textarea,select{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;background:var(--card);max-width:100%}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
label{font-weight:700;display:flex;flex-direction:column;gap:4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
.prog{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.prog i{display:block;height:100%;background:var(--honey)}
.speaker{width:110px;height:110px;border-radius:50%;border:3px solid var(--ink);background:var(--honey);cursor:pointer;box-shadow:0 5px 0 var(--ink);display:grid;place-items:center}
.speaker:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.speaker svg{width:52px;height:52px}
.answer{width:100%;max-width:440px;text-align:center;font-family:var(--display);font-size:1.7rem;letter-spacing:.08em;padding:10px}
.panel{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:10px 14px;max-width:520px}
.tag{background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}
.big{font-family:var(--display);font-size:2.2rem;font-weight:800}
.good{color:var(--good)}.badc{color:var(--bad)}
.spell{font-family:var(--display);font-size:1.9rem;letter-spacing:.1em;overflow-wrap:anywhere}
.spell .x{color:var(--bad);text-decoration:line-through}
.spell .m{background:var(--honey);border-bottom:4px solid var(--ink);border-radius:4px}
.chunks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chunks span{font-family:var(--display);font-size:1.6rem;border:2px solid var(--ink);border-radius:10px;padding:2px 12px;background:var(--paper)}
.chunks span:nth-child(even){background:var(--honey)}
.pair{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;text-align:left}
.pair small{font-weight:700;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td input[type=text]{width:120px;padding:4px 8px;border-width:1px}
.pill{border-radius:999px;padding:1px 10px;font-weight:700;font-size:.8rem;border:2px solid var(--ink);white-space:nowrap}
.pill.b1{background:#F0A29B}.pill.b2{background:#FFE694}.pill.b3{background:var(--honey)}.pill.b4,.pill.b5{background:var(--amber);color:#fff}
.note{background:var(--card);border-left:6px solid var(--amber);padding:10px 14px;border-radius:8px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.lrow.on{border-color:var(--ink);background:var(--paper)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.4rem;font-weight:700;letter-spacing:.06em;background:var(--paper);border:2px dashed var(--ink);border-radius:12px;padding:8px 14px;text-align:center;overflow-wrap:anywhere}
.code.small{font-size:.95rem;padding:2px 8px;border-width:1px}
.meter{display:inline-block;height:10px;min-width:2px;background:var(--honey);border:1px solid var(--ink);border-radius:999px;vertical-align:middle}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.pop{animation:pop .25s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.btn:active,.mode:active,.speaker:active{transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const KEY = 'spellhive.v1';
const SAMPLE = ['necessary','rhythm','conscience','mischievous','pneumonia','silhouette','bureaucracy','chrysanthemum','onomatopoeia','connoisseur','fluorescent','hemorrhage','lieutenant','maneuver','questionnaire','sacrilegious','vacuum','zucchini','acquiesce','guarantee'];
const GAP = [0,0,1,2,4,7];            // days until the next review, by box
const BOXNAME = ['','Needs work','Learning','Learning','Mastered','Mastered'];
const LEVELS = [[0,'Larva'],[25,'Worker Bee'],[75,'Forager'],[150,'Guard Bee'],[300,'Queen Bee']];
const AVATARS = ['🐝','🦋','🐞','🦊','🐼','🦄','🐯','🐸'];
const BADGES = {
  first:['First Flight','Finished a first session'],
  comeback:['Comeback','Spelled a past miss correctly'],
  run10:['Hot Streak','10 correct in a row'],
  day3:['3-Day Buzz','Practiced 3 days in a row'],
  day7:['Week of Honey','Practiced 7 days in a row'],
  honey10:['Honey Maker','Mastered 10 words'],
  crown:["Queen's Crown",'Finished a Mock Bee with no misses']
};
const SESSION_SIZE = 10, BEE_SIZE = 25;
// Cloud sync and list sharing are optional. Forks: put your own Firebase project here, or leave both empty to turn the cloud features off.
const FB = { apiKey:'AIzaSyBBFFeYYMIjdhRIXxWBUb1M1C3NCbMrHOA', projectId:'spellhive-faf11' };
const cloudOn = !!(FB.apiKey && FB.projectId);
const app = document.getElementById('app');

/* ---------- storage ---------- */
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){ saveLocal(); scheduleSync(); }
function starterList(){ return {id:'sample', name:'Tricky words starter', kind:'builtin', t:0, words:SAMPLE.slice()}; }
let S = load() || { profiles:[], lists:[starterList()], fix:{}, gone:{}, cur:null };
function migrate(){
  S.profiles = S.profiles || []; S.fix = S.fix || {}; S.gone = S.gone || {};
  if(!S.lists || !S.lists.length) S.lists = [starterList()];
  for(const l of S.lists){ if(!l.kind) l.kind = l.id==='sample' ? 'builtin' : 'own'; if(l.id==='sample') l.name = 'Tricky words starter'; }
  for(const p of S.profiles){ p.badges = p.badges || []; p.words = p.words || {}; }
}
migrate();
let V = { view:'profiles', avatar:AVATARS[0], msg:'', confirm:'', sync:'', defaultList:'' };
let sess = null;

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFC').trim().toLowerCase().replace(/\s+/g,' ');
// fold: what counts as the same spelling. Accents are ignored (pinata = piñata) and curly apostrophes match straight ones.
const fold = s => norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\u2018\u2019]/g,"'");
const uid = () => Math.random().toString(36).slice(2,9);
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(off){ const d = new Date(); d.setDate(d.getDate()+(off||0)); return dstr(d); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prof(){ return S.profiles.find(p => p.id===S.cur) || null; }
function activeList(){ const p = prof(); return S.lists.find(l => l.id===(p&&p.listId)) || S.lists[0]; }
function level(pts){ let n = LEVELS[0][1]; for(const [min,name] of LEVELS) if(pts>=min) n = name; return n; }
/* ---------- practice log (per day, per device, so two phones never double count) ---------- */
const IDLE_CAP = 90; // seconds counted per step at most, so a phone left open does not inflate practice time
function logDay(p, d){
  if(!S.dev) S.dev = uid();
  const days = p.days || (p.days = {}), b = days[today()] || (days[today()] = {}), r = b[S.dev] || (b[S.dev] = {sec:0, ok:0, bad:0, n:0, ts:0});
  r.sec += d.sec || 0; r.ok += d.ok || 0; r.bad += d.bad || 0; r.n += d.n || 0; r.ts = Date.now();
  const keys = Object.keys(days); if(keys.length > 400) delete days[keys.sort()[0]];
}
function tick(){ const now = Date.now(), sec = Math.min(IDLE_CAP, Math.max(0, Math.round((now - sess.mark) / 1000))); sess.mark = now; return sec; }
function dayTotals(p, day){ const b = (p.days || {})[day] || {}, t = {sec:0, ok:0, bad:0, n:0}; for(const k in b) for(const f in t) t[f] += b[k][f] || 0; return t; }
function rangeTotals(p, days){ const t = {sec:0, ok:0, bad:0, n:0, active:0}; for(const day of days){ const d = dayTotals(p, day); t.sec += d.sec; t.ok += d.ok; t.bad += d.bad; t.n += d.n; if(d.sec || d.ok || d.bad) t.active++; } return t; }
function lastDays(n){ const out = []; for(let i=0;i<n;i++) out.push(today(-i)); return out; }
function fmtTime(sec){ if(!sec) return '0 min'; const m = Math.round(sec/60); return m < 1 ? 'under 1 min' : m < 60 ? m + ' min' : Math.floor(m/60) + ' h ' + (m%60) + ' min'; }
function pct(ok, bad){ return ok + bad ? Math.round(ok / (ok + bad) * 100) + '%' : 'n/a'; }
function parseWords(text){ const seen = new Set(), out = []; for(const raw of String(text).split(/[\n,;]+/)){ const w = norm(raw); if(w && !seen.has(w)){ seen.add(w); out.push(w); } } return out; }
function buckets(){
  const p = prof(), t = today(), b = {miss:[],due:[],fresh:[],trouble:[],mastered:0,total:0};
  for(const w of activeList().words){
    b.total++;
    const r = p.words[w];
    if(!r){ b.fresh.push(w); continue; }
    if(r.box>=4) b.mastered++;
    if(r.bad>0 && r.box<4) b.trouble.push(w);
    if(r.box===1) b.miss.push(w); else if(r.due<=t) b.due.push(w);
  }
  return b;
}
function syll(w){
  const f = S.fix[w];
  if(f && f.chunks) return f.chunks.split(/[-·\s]+/).filter(Boolean);
  const m = w.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/gi);
  return (m && m.join('')===w) ? m : [w];
}
function lcs(a,b){
  const n=a.length, m=b.length, d=[];
  for(let i=0;i<=n;i++) d.push(new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) d[i][j] = a[i]===b[j] ? d[i+1][j+1]+1 : Math.max(d[i+1][j], d[i][j+1]);
  const ma=new Array(n).fill(false), mb=new Array(m).fill(false);
  let i=0, j=0;
  while(i<n && j<m){ if(a[i]===b[j]){ ma[i]=mb[j]=true; i++; j++; } else if(d[i+1][j]>=d[i][j+1]) i++; else j++; }
  return [ma,mb];
}
function mask(text,w){ return text.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'_____'); }

/* ---------- speech + dictionary ---------- */
const dict = {};
let audioEl = null, sayTok = 0;
const canSpeak = 'speechSynthesis' in window;
function quiet(){ try{ if(audioEl){ audioEl.pause(); audioEl = null; } if(canSpeak) speechSynthesis.cancel(); }catch(e){} }
function tts(text, rate){
  if(!canSpeak) return;
  try{ const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate = rate || 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
async function getInfo(w){
  if(w in dict) return dict[w];
  let info = null;
  try{
    const c = new AbortController(), tm = setTimeout(() => c.abort(), 3000);
    const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w), {signal:c.signal});
    clearTimeout(tm);
    if(res.ok){
      const j = await res.json();
      info = {def:'',ex:'',origin:'',audio:''};
      for(const e of j){
        if(!info.origin && e.origin) info.origin = e.origin;
        for(const ph of e.phonetics||[]) if(!info.audio && ph.audio) info.audio = ph.audio;
        for(const m of e.meanings||[]) for(const d of m.definitions||[]){
          if(!info.def && d.definition) info.def = (m.partOfSpeech ? '('+m.partOfSpeech+') ' : '') + d.definition;
          if(!info.ex && d.example) info.ex = d.example;
        }
      }
    }
  }catch(e){}
  dict[w] = info;
  return info;
}
async function sayWord(w, slow){
  const tok = ++sayTok, f = S.fix[w];
  quiet();
  if(!(f && f.say)){
    const info = await getInfo(w);
    if(tok !== sayTok) return;
    if(info && info.audio){
      try{ audioEl = new Audio(info.audio); audioEl.playbackRate = slow ? 0.7 : 1; await audioEl.play(); return; }catch(e){ audioEl = null; }
    }
  }
  tts((f && f.say) || w, slow ? 0.5 : 0.85);
}

/* ---------- cloud: family sync and shared lists (optional) ---------- */
const ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newCode(){ const a = new Uint32Array(8); crypto.getRandomValues(a); let c = ''; for(const n of a) c += ALPHA[n % ALPHA.length]; return c; }
function cleanCode(v){ return String(v).toUpperCase().replace(/^\s*(HIVE|LIST)/, '').replace(/[^A-Z0-9]/g, ''); }
function fmt(prefix, code){ return prefix + '-' + code.slice(0,4) + '-' + code.slice(4); }
function shareLink(code){ return location.origin + location.pathname + '#list-' + code; }
function docUrl(col, id, extra){ return 'https://firestore.googleapis.com/v1/projects/' + FB.projectId + '/databases/(default)/documents/' + col + '/' + id + '?key=' + FB.apiKey + (extra || ''); }
async function cloudGet(col, id){
  const r = await fetch(docUrl(col, id));
  if(r.status === 404) return null;
  if(!r.ok) throw new Error('code ' + r.status);
  const j = await r.json(), o = {};
  for(const k in j.fields || {}){ const v = j.fields[k]; o[k] = ('stringValue' in v) ? v.stringValue : Number(v.integerValue); }
  return o;
}
async function cloudPut(col, id, obj, createOnly){
  const fields = {};
  for(const k in obj) fields[k] = typeof obj[k] === 'string' ? {stringValue:obj[k]} : {integerValue:String(obj[k])};
  const r = await fetch(docUrl(col, id, createOnly ? '&currentDocument.exists=false' : ''), {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({fields})});
  if(!r.ok) throw new Error('code ' + r.status);
}
function cloudErr(e){ return 'Could not reach the cloud (' + ((e && e.message) || 'network') + '). Check the internet connection and try again.'; }
function busy(){ V.msg = 'Contacting the cloud…'; render(); }
function payload(){ return JSON.stringify({v:1, profiles:S.profiles, lists:S.lists, fix:S.fix, gone:S.gone}); }
function newer(x, y){ return (y.t||0) > (x.t||0) ? y : x; }
function mergeProfile(x, y){
  const n = newer(x, y), r = Object.assign({}, n), ra = Math.max(x.resetAt||0, y.resetAt||0);
  r.resetAt = ra;
  r.badges = (x.resetAt||0) === (y.resetAt||0) ? [...new Set([...(x.badges||[]), ...(y.badges||[])])] : (n.badges||[]).slice();
  r.days = {};
  for(const src of [x.days || {}, y.days || {}]) for(const day in src) for(const dev in src[day]){
    const rec = src[day][dev], slot = r.days[day] || (r.days[day] = {});
    if((rec.ts||0) >= ra && (!slot[dev] || (rec.ts||0) > (slot[dev].ts||0))) slot[dev] = rec;
  }
  r.words = {};
  const xw = x.words || {}, yw = y.words || {};
  for(const w of new Set([...Object.keys(xw), ...Object.keys(yw)])){
    const a = xw[w], b = yw[w], rec = !a ? b : !b ? a : ((b.ts||0) > (a.ts||0) ? b : a);
    if((rec.ts||0) >= ra) r.words[w] = rec;
  }
  return r;
}
function mergeState(a, b){
  const gone = Object.assign({}, a.gone || {});
  for(const k in b.gone || {}) gone[k] = Math.max(gone[k]||0, b.gone[k]);
  const byId = (xs, ys, f) => { const m = new Map(); for(const x of xs || []) m.set(x.id, x); for(const y of ys || []) m.set(y.id, m.has(y.id) ? f(m.get(y.id), y) : y); return [...m.values()]; };
  const profiles = byId(a.profiles, b.profiles, mergeProfile).filter(p => !gone[p.id]);
  const lists = byId(a.lists, b.lists, newer).filter(l => l.kind==='builtin' || !(gone[l.id] >= (l.t||0)));
  const fix = Object.assign({}, a.fix || {});
  for(const w in b.fix || {}) fix[w] = fix[w] ? newer(fix[w], b.fix[w]) : b.fix[w];
  return {profiles, lists, fix, gone};
}
function applyMerge(remote){
  const m = mergeState(S, remote);
  S.profiles = m.profiles; S.lists = m.lists; S.fix = m.fix; S.gone = m.gone;
  migrate();
  if(S.cur && !prof()) S.cur = null;
}
let syncTimer = null, syncBusy = false;
function scheduleSync(ms){ if(!cloudOn || !S.sync) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms == null ? 3000 : ms); }
async function syncNow(){
  if(!cloudOn || !S.sync || syncBusy) return;
  syncBusy = true; clearTimeout(syncTimer);
  try{
    const doc = await cloudGet('hives', S.sync.code);
    if(doc && doc.data) applyMerge(JSON.parse(doc.data));
    const out = payload();
    if(!doc || doc.data !== out) await cloudPut('hives', S.sync.code, {data:out, updated:Date.now()});
    V.sync = 'ok';
  }catch(e){ V.sync = navigator.onLine === false ? 'offline' : 'error'; }
  syncBusy = false; saveLocal();
  const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName || '');
  if(V.view==='home' || (V.view==='profiles' && !typing)) render();
}

async function joinFamily(raw, mode){
  const code = cleanCode(raw);
  if(code.length !== 8){ V.msg = 'A family code has 8 letters and numbers after HIVE. Check it and try again.'; render(); return; }
  busy();
  try{
    const doc = await cloudGet('hives', code);
    if(!doc){ V.msg = 'No family uses that code. Check it and try again.'; render(); return; }
    const remote = doc.data ? JSON.parse(doc.data) : {};
    const theirs = (remote.profiles || []).filter(p => !(remote.gone || {})[p.id]);
    if(!mode && S.profiles.length && theirs.length){ V.join = {code, theirs:theirs.map(p => p.name), mine:S.profiles.map(p => p.name)}; V.msg = ''; render(); return; }
    if(mode === 'replace'){ S.profiles = []; S.cur = null; }

}

/* ---------- sessions ---------- */
function startSession(mode){
  const b = buckets(), words = activeList().words, p = prof();
  let q;
  if(mode==='trouble') q = shuffle(b.trouble);
  else if(mode==='bee') q = shuffle(words).slice(0, BEE_SIZE);
  else {
    q = shuffle(b.miss).concat(shuffle(b.due), b.fresh).slice(0, SESSION_SIZE);
    if(!q.length) q = words.slice().sort((x,y) => p.words[x].box - p.words[y].box).slice(0, SESSION_SIZE);
  }
  if(!q.length){ V.msg = mode==='trouble' ? 'No trouble words right now. Nice work!' : 'This list has no words yet. Tap Change list to pick another.'; render(); return; }
  V.msg = '';
  sess = { mode, q:q.map(w => ({w, retry:false})), i:0, pts:0, right:0, missed:[], run:0, stage:'ask', attempt:'', panel:null, newBadges:[], out:false, last:'', coverFail:false, tries:{}, mark:Date.now() };
  V.view = 'play';
  render();
  sayWord(sess.q[0].w);
}
function award(id){ const p = prof(); if(!p.badges.includes(id)){ p.badges.push(id); if(sess) sess.newBadges.push(id); } }
function check(){
  const it = sess.q[sess.i], w = it.w, a = norm(sess.attempt);
  if(!a) return;
  const p = prof();
  const r = p.words[w] || (p.words[w] = {box:1,due:'',att:0,ok:0,bad:0,miss:[]});
  r.att++; r.last = today(); r.ts = Date.now(); p.t = r.ts;
  if(fold(a) === fold(w)){
    r.ok++;
    if(!it.retry){
      if(r.bad>0) award('comeback');
      r.box = Math.min(5, r.box+1); r.due = today(GAP[r.box]); sess.right++;
    }
    p.points++; sess.pts++; sess.run++; logDay(p, {sec:tick(), ok:it.retry?0:1});
    if(sess.run>=10) award('run10');
    sess.stage = 'right';
    sayTok++; quiet(); tts('Correct!');
  } else {
    r.bad++; r.box = 1; r.due = today(); logDay(p, {sec:tick(), bad:1});
    if(!r.miss.includes(a)){ r.miss.unshift(a); r.miss = r.miss.slice(0,5); }
    sess.run = 0; sess.last = a; sess.tries[w] = (sess.tries[w]||0) + 1;
    if(!sess.missed.includes(w)) sess.missed.push(w);
    if(sess.mode==='bee') sess.out = true;
    else sess.q.splice(Math.min(sess.q.length, sess.i+3), 0, {w, retry:true});
    sess.stage = 'study';
    sayTok++; quiet();
  }
  sess.attempt = '';
  save(); render();
}
function checkCover(){
  const w = sess.q[sess.i].w;
  if(!norm(sess.attempt)) return;
  logDay(prof(), {sec:tick()}); prof().t = Date.now();
  if(fold(sess.attempt) === fold(w)){ next(); }
  else { sess.last = norm(sess.attempt); sess.tries[w] = (sess.tries[w]||0) + 1; sess.attempt=''; sess.coverFail = true; sess.stage='study'; render(); }
}
function next(){
  sess.attempt=''; sess.panel=null; sess.coverFail=false;
  if(sess.out || ++sess.i >= sess.q.length){ finish(); return; }
  sess.stage='ask'; render(); sayWord(sess.q[sess.i].w);
}
function finish(){
  const p = prof(), t = today();
  p.t = Date.now(); logDay(p, {sec:tick(), n:1});
  if(p.lastDay !== t){ p.streak = (p.lastDay === today(-1)) ? p.streak+1 : 1; p.lastDay = t; }
  award('first');
  if(p.streak>=3) award('day3');
  if(p.streak>=7) award('day7');
  if(Object.values(p.words).filter(r => r.box>=4).length >= 10) award('honey10');
  if(sess.mode==='bee' && !sess.out) award('crown');
  sess.stage='done';
  quiet(); save(); render();
}

    return `<tr><td><b>${p.avatar} ${esc(p.name)}</b></td><td class="n">${fmtTime(w.sec)}</td><td class="n">${w.active} of 7</td><td class="n">${fmtTime(all.sec)}</td><td class="n">${ok}</td><td class="n">${bad}</td><td class="n">${pct(ok, bad)}</td><td class="n">${mastered}</td><td class="n">${p.streak}</td><td>${last ? esc(niceDay(last)) : 'Not yet'}</td></tr>`;
  }).join('');
  const days = week.map(day => ({day, t:dayTotals(cur, day)})), max = Math.max(60, ...days.map(d => d.t.sec));
  const daily = days.map(d => `<tr><td>${esc(niceDay(d.day))}</td><td class="n">${fmtTime(d.t.sec)}</td><td><i class="meter" style="width:${Math.round(d.t.sec / max * 120)}px"></i></td><td class="n">${d.t.n}</td><td class="n">${d.t.ok}</td><td class="n">${d.t.bad}</td><td class="n">${pct(d.t.ok, d.t.bad)}</td></tr>`).join('');
  return `<section class="card">
      <h3>Practice report</h3>
      <div class="scroll"><table><thead><tr><th>Player</th><th class="n">Time, last 7 days</th><th class="n">Days practiced</th><th class="n">Time, all</th><th class="n">Correct</th><th class="n">Mistakes</th><th class="n">Accuracy</th><th class="n">Mastered</th><th class="n">Streak</th><th>Last practiced</th></tr></thead><tbody>${rows}</tbody></table></div>
      <h3>${esc(cur.name)}, last 7 days</h3>
      <div class="scroll"><table><thead><tr><th>Day</th><th class="n">Time</th><th></th><th class="n">Sessions</th><th class="n">Correct</th><th class="n">Mistakes</th><th class="n">Accuracy</th></tr></thead><tbody>${daily}</tbody></table></div>
      <p class="muted">Correct and mistakes count first tries only. Time counts while a session is open, up to ${IDLE_CAP} seconds per step, and was not recorded before this report was added.</p>
    </section>`;
}
function niceDay(day){ const [y,m,d] = day.split('-').map(Number); return new Date(y, m-1, d).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}); }
function listsCard(){
  const rows = S.lists.map(l => {
    const share = l.code
      ? `<span class="code small">${fmt('LIST', l.code)}</span><button class="chip" data-act="copy" data-text="${fmt('LIST', l.code)}">Copy code</button><button class="chip" data-act="copy" data-text="${esc(shareLink(l.code))}">Copy link</button>`
      : (l.kind==='own' && cloudOn ? `<button class="chip" data-act="sharelist" data-id="${l.id}">Share list</button>` : '');
    const del = l.kind==='builtin' ? '' : `<button class="chip" data-act="dellist" data-id="${l.id}">${V.confirm==='list:'+l.id ? 'Tap again to delete' : 'Delete'}</button>`;
    return `<div class="lrow"><div><b>${esc(l.name)}</b><br><span class="muted">${listMeta(l)}</span></div><div class="row">${share}${del}</div></div>`;
  }).join('');
  return `<section class="card">
      <h3>Word lists</h3>
      ${rows}
      ${cloudOn ? '<p class="muted">Sharing gives a list code other families can enter. A shared list cannot be changed afterwards. To fix a word, save a new list and share its code.</p>' : ''}
      <div><button class="btn small alt" data-act="go" data-v="lists">Add or switch lists</button></div>
    </section>`;
}
function syncCard(){
  if(!cloudOn) return '';
  if(S.sync){
    const c = fmt('HIVE', S.sync.code);
    return `<section class="card">
      <div class="bar"><h3>Sync across phones</h3><span class="muted">${syncLabel()}</span></div>
      <p class="muted">This is your family code. Enter it on another phone to continue there. Anyone with the code can see and change your family’s data, so keep it private.</p>
      <p class="code">${c}</p>
      <div class="row">
        <button class="btn small" data-act="copy" data-text="${c}">Copy code</button>
        <button class="btn small alt" data-act="syncnow">Sync now</button>
        <button class="btn small danger" data-act="syncoff">${V.confirm==='syncoff' ? 'Tap again to turn off' : 'Turn off sync on this phone'}</button>
      </div>
    </section>`;
  }
  return `<section class="card">
      <h3>Sync across phones</h3>
      <p class="muted">Keep players, lists and progress the same on every phone. Sync stores first names, word lists and spelling results online under a private family code. No email or login.</p>
      <div><button class="btn small" data-act="syncon">Turn on sync</button></div>
      <label for="join-code">Already have a family code?<input type="text" id="join-code" placeholder="HIVE-7K2Q-M9XD" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
      <div><button class="btn small alt" data-act="syncjoin">Join with this code</button></div>
    </section>`;
}
function render(){
  if(V.join){ app.innerHTML = vJoin(); return; }
  const p = prof();
  if(!p) V.view = 'profiles';
  app.innerHTML = V.view==='home' ? vHome() : V.view==='play' ? vPlay() : V.view==='parent' ? vParent() : V.view==='lists' ? vLists() : vProfiles();
  const f = app.querySelector('[data-focus]');
  if(f){ f.focus(); if(f.tagName==='INPUT'){ const n = f.value.length; try{ f.setSelectionRange(n,n); }catch(e){} } }
}

/* ---------- actions ---------- */
function twoStep(name, fn){ if(V.confirm===name){ V.confirm=''; fn(); } else { V.confirm=name; render(); } }
const ACT = {
  avatar(t){ V.avatar = t.dataset.a; const n = document.getElementById('new-name').value; render(); document.getElementById('new-name').value = n; },
  pick(t){ S.cur = t.dataset.id; V.view='home'; V.msg=''; save(); render(); },
  go(t){ quiet(); sayTok++; V.view = t.dataset.v; V.msg=''; V.confirm=''; sess = null; render(); },
  start(t){ startSession(t.dataset.mode); },
  quit(){ quiet(); sayTok++; sess=null; V.view='home'; render(); },
  say(){ sayWord(sess.q[sess.i].w); refocus(); },
  slow(){ sayWord(sess.q[sess.i].w, true); refocus(); },
  letters(){ sayTok++; quiet(); tts(sess.q[sess.i].w.toUpperCase().split('').join(', '), 0.7); },
  async info(t){
    const w = sess.q[sess.i].w, k = t.dataset.k, i = sess.i;
    sess.panel = 'Looking it up…'; render();
    const info = await getInfo(w);
    if(!sess || sess.i!==i || sess.stage!=='ask') return;
    const none = {def:'No definition found for this word.', ex:'No example sentence found for this word.', origin:'No origin found for this word.'};
    const text = info && info[k];
    sess.panel = text ? mask(text, w) : (info ? none[k] : 'The dictionary could not be reached. Check the internet connection.');
    render();
    if(text && k==='ex'){ sayTok++; quiet(); tts(text, 0.85); }
  },
  check(){ check(); },
  next(){ next(); },
  cover(){ sess.stage='cover'; sess.attempt=''; quiet(); render(); },
  peek(){ sess.stage='study'; sess.attempt=''; render(); },
  skip(){ const w = sess.q[sess.i].w; sess.q = sess.q.filter((it,i) => i <= sess.i || it.w !== w); next(); },
  checkcover(){ checkCover(); },
  test(t){ sayWord(t.dataset.w); },
  addlist(){
    const name = document.getElementById('list-name').value.trim(), words = parseWords(document.getElementById('list-words').value);
    if(!words.length){ V.msg = 'Type or paste at least one word before saving the list.'; render(); return; }
    const l = {id:uid(), name:name || 'My word list', kind:'own', t:Date.now(), words}, p = prof();
    S.lists.push(l); p.listId = l.id; p.t = l.t; V.view = 'home';
    V.msg = `Saved “${l.name}” with ${words.length} words.` + (cloudOn ? ' To share it with other families, open the grown-ups area.' : '');
    save(); render();
  },
  uselist(t){ const p = prof(); p.listId = t.dataset.id; p.t = Date.now(); V.view = 'home'; V.msg = ''; save(); render(); },
  dellist(t){ const id = t.dataset.id; twoStep('list:'+id, () => { S.gone[id] = Date.now(); S.lists = S.lists.filter(l => l.id!==id); V.msg = 'List deleted.'; save(); render(); }); },
  async sharelist(t){
    const l = S.lists.find(x => x.id === t.dataset.id); if(!l) return;
    busy();
    try{
      const code = newCode();
      await cloudPut('lists', code, {name:l.name, words:JSON.stringify(l.words), updated:Date.now()}, true);
      l.code = code; l.t = Date.now();
      V.msg = `“${l.name}” is shared. Send the list code or link to other families.`;
      save();
    }catch(e){ V.msg = cloudErr(e); }
    render();
  },
  async joinlist(){
    const code = cleanCode(document.getElementById('list-code').value);
    if(code.length !== 8){ V.msg = 'A list code has 8 letters and numbers after LIST. Check it and try again.'; render(); return; }
    busy(); await addSharedList(code); render();
  },
  async copy(t){
    try{ await navigator.clipboard.writeText(t.dataset.text); V.msg = 'Copied: ' + t.dataset.text; }
    catch(e){ V.msg = 'Copy was blocked. Copy it by hand: ' + t.dataset.text; }
    render();
  },
  async syncon(){
    busy();
    try{
      let code = newCode();
      for(let i=0; i<3 && await cloudGet('hives', code); i++) code = newCode();
      await cloudPut('hives', code, {data:payload(), updated:Date.now()});
      S.sync = {code}; V.sync = 'ok'; V.msg = 'Sync is on. Enter the family code on your other phones.';
      saveLocal();
    }catch(e){ V.msg = cloudErr(e); }
    render();
  },
  syncjoin(){ joinFamily(document.getElementById('join-code').value); },
  joinmode(t){ joinFamily(V.join.code, t.dataset.m); },
  joincancel(){ V.join = null; V.msg = ''; render(); },
  async syncnow(){ await syncNow(); V.msg = V.sync==='ok' ? 'Synced.' : 'Sync did not finish. Check the internet connection and try again.'; render(); },
  syncoff(){ twoStep('syncoff', () => { delete S.sync; V.sync = ''; V.msg = 'Sync is off on this phone. Everything stays saved here.'; saveLocal(); render(); }); },
  reset(){ twoStep('reset', () => { const p = prof(); p.resetAt = p.t = Date.now(); p.words={}; p.days={}; p.points=0; p.streak=0; p.lastDay=''; p.badges=[]; V.msg='Progress erased.'; save(); render(); }); },
  remove(){ twoStep('remove', () => { S.gone[S.cur] = Date.now(); S.profiles = S.profiles.filter(p => p.id!==S.cur); S.cur=null; V.view='profiles'; save(); render(); }); },
  mkbackup(){ document.getElementById('backup').value = JSON.stringify(S); },
  async copybackup(){
    const ta = document.getElementById('backup'); if(!ta.value) ta.value = JSON.stringify(S);
    try{ await navigator.clipboard.writeText(ta.value); V.msg='Backup copied.'; }catch(e){ ta.select(); V.msg='Copy was blocked. The text is selected, so press Ctrl+C or Cmd+C.'; return; }
    const keep = ta.value; render(); document.getElementById('backup').value = keep;
  },
  dlbackup(){
    try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'})); a.download = 'spellhive-backup-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  },
  restore(){
    try{
      const o = JSON.parse(document.getElementById('backup').value);
      if(!o || !Array.isArray(o.profiles) || !Array.isArray(o.lists) || !o.lists.length) throw 0;
      S = o; migrate(); if(!prof()) S.cur = S.profiles.length ? S.profiles[0].id : null;
      V.msg = 'Backup restored.'; save();
    }catch(e){ V.msg = 'That text is not a SpellHive backup. Paste the full backup and try again.'; }
    render();
  }
};
function refocus(){ const f = document.getElementById('answer'); if(f) f.focus(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  if(V.confirm && !['dellist','reset','remove','syncoff'].includes(t.dataset.act)) V.confirm = '';
  ACT[t.dataset.act](t);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.id !== 'add-player') return;
  const name = document.getElementById('new-name').value.trim();
  if(!name) { document.getElementById('new-name').focus(); return; }
  const p = {id:uid(), name, avatar:V.avatar, points:0, streak:0, lastDay:'', badges:[], listId:V.defaultList || S.lists[0].id, words:{}, t:Date.now()};
  S.profiles.push(p); S.cur = p.id; V.view='home'; save(); render();
});
document.addEventListener('input', e => { if(e.target.id==='answer' && sess) sess.attempt = e.target.value; });
document.addEventListener('keydown', e => {
  if(e.key!=='Enter' || e.repeat || e.target.id!=='answer' || !sess) return;
  e.preventDefault();
  if(sess.stage==='ask') check(); else if(sess.stage==='cover') checkCover();
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.chg;
  if(k==='pick'){ prof().listId = t.value; prof().t = Date.now(); save(); render(); }
  else if(k==='fix'){
    const w = t.dataset.w, v = t.value.trim(), f = S.fix[w] || (S.fix[w] = {});
    if(v) f[t.dataset.k] = v; else delete f[t.dataset.k];
    f.t = Date.now();
    save();
  }
  else if(k==='file' && t.files[0]){ t.files[0].text().then(txt => { document.getElementById('backup').value = txt; }); }
});

if(prof()) V.view = 'home';
render();
window.addEventListener('online', () => syncNow());
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && !sess) syncNow(); });
(async () => {
  const m = location.hash.match(/^#list-([A-Za-z0-9]+)$/);
  if(m && cloudOn){ await addSharedList(cleanCode(m[1])); render(); }
  syncNow();
})();
</script>
</body>
</html>
