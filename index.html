<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpellHive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one centred column, a honey header band, chunky game buttons, a hex hive as the progress map. Single light theme by choice. */
  color-scheme: light;
  --ink:#1F2340;
  --paper:#FFFBEA;
  --card:#FFFFFF;
  --honey:#FFC629;
  --amber:#B86200;
  --good:#1B8553;
  --bad:#C93A30;
  --line:#E6DCB8;
  --muted:#5D6079;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.4rem}h3{font-size:1.1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.band{background:var(--honey);border-bottom:3px solid var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
main.wrap{display:flex;flex-direction:column;gap:16px;padding-bottom:48px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.brand h1 span{font-size:1.6rem}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.center{align-items:center;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center .row{justify-content:center}
.btn{background:var(--honey);border:2px solid var(--ink);border-radius:14px;padding:10px 20px;font-family:var(--display);font-weight:800;font-size:1.15rem;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--card)}
.btn.small{font-size:.95rem;padding:6px 14px;box-shadow:0 3px 0 var(--ink)}
.btn.danger{background:var(--card);color:var(--bad);border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.chip{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.chip:hover{background:var(--honey)}
.link{background:none;border:0;padding:4px;font-weight:700;text-decoration:underline;cursor:pointer}
.muted{color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:16px;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:4px}
.mode.main{background:var(--honey)}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mode b{font-family:var(--display);font-size:1.3rem}
.mode span{font-size:.95rem}
.hive{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:30px;height:34px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line)}
.cell.b1{background:#F0A29B}.cell.b2{background:#FFE694}.cell.b3{background:var(--honey)}.cell.b4,.cell.b5{background:var(--amber)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend .cell{width:16px;height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:.9rem;background:var(--paper)}
.badge b{display:block;font-family:var(--display)}
.badge.off{opacity:.45;border-style:dashed}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.player{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800}
.player i{font-style:normal;font-size:2.4rem}
.av{font-size:1.5rem;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 8px;cursor:pointer}
.av.on{border-color:var(--ink);background:var(--honey)}
input[type=text],textarea,select{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;background:var(--card);max-width:100%}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
label{font-weight:700;display:flex;flex-direction:column;gap:4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
.prog{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.prog i{display:block;height:100%;background:var(--honey)}
.speaker{width:110px;height:110px;border-radius:50%;border:3px solid var(--ink);background:var(--honey);cursor:pointer;box-shadow:0 5px 0 var(--ink);display:grid;place-items:center}
.speaker:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.speaker svg{width:52px;height:52px}
.answer{width:100%;max-width:440px;text-align:center;font-family:var(--display);font-size:1.7rem;letter-spacing:.08em;padding:10px}
.choices{display:grid;gap:10px;width:100%;max-width:520px}
.choice{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;text-align:left;font-size:1.05rem;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.choice.word{text-align:center;font-family:var(--display);font-size:1.3rem}
.clue{font-size:1.25rem;line-height:1.45;max-width:520px}
.meaning{max-width:520px;text-align:left}
.meaning b{display:block;font-family:var(--display)}
.mtable td input{width:100%;min-width:160px}
.panel{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:10px 14px;max-width:520px}
.tag{background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}
.big{font-family:var(--display);font-size:2.2rem;font-weight:800}
.good{color:var(--good)}.badc{color:var(--bad)}
.spell{font-family:var(--display);font-size:1.9rem;letter-spacing:.1em;overflow-wrap:anywhere}
.spell .x{color:var(--bad);text-decoration:line-through}
.spell .m{background:var(--honey);border-bottom:4px solid var(--ink);border-radius:4px}
.chunks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chunks span{font-family:var(--display);font-size:1.6rem;border:2px solid var(--ink);border-radius:10px;padding:2px 12px;background:var(--paper)}
.chunks span:nth-child(even){background:var(--honey)}
.pair{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;text-align:left}
.pair small{font-weight:700;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td input[type=text]{width:120px;padding:4px 8px;border-width:1px}
.pill{border-radius:999px;padding:1px 10px;font-weight:700;font-size:.8rem;border:2px solid var(--ink);white-space:nowrap}
.pill.b1{background:#F0A29B}.pill.b2{background:#FFE694}.pill.b3{background:var(--honey)}.pill.b4,.pill.b5{background:var(--amber);color:#fff}
.note{background:var(--card);border-left:6px solid var(--amber);padding:10px 14px;border-radius:8px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.lrow.on{border-color:var(--ink);background:var(--paper)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.4rem;font-weight:700;letter-spacing:.06em;background:var(--paper);border:2px dashed var(--ink);border-radius:12px;padding:8px 14px;text-align:center;overflow-wrap:anywhere}
.code.small{font-size:.95rem;padding:2px 8px;border-width:1px}
.meter{display:inline-block;height:10px;min-width:2px;background:var(--honey);border:1px solid var(--ink);border-radius:999px;vertical-align:middle}
/* tabs, mascot, goal ring, games, shop, teams */
body.has-tabs main.wrap{padding-bottom:110px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--ink);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:190px;background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.85rem;cursor:pointer;color:var(--muted)}
.tabs button i{font-style:normal;font-size:1.7rem;line-height:1.1}
.tabs button.on{color:var(--ink);background:var(--paper);box-shadow:inset 0 4px 0 var(--honey)}
.me-btn{background:none;border:0;padding:0;font:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.icon-btn{background:var(--card);border:2px solid var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1.05rem;padding:0}
.ava{position:relative;display:inline-block;line-height:1}
.ava .hat{position:absolute;left:50%;top:-.5em;transform:translateX(-50%);font-size:.72em}
.me-big{font-size:4.2rem;padding-top:14px}
.mascot{display:flex;align-items:center;gap:12px}
.mascot .bee{font-size:3.2rem;animation:bob 2.4s ease-in-out infinite;flex:none}
.bubble{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:700;position:relative;text-align:left}
.bubble:before{content:'';position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.goal{flex-direction:row;align-items:center}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p) * 1%), var(--line) 0);display:grid;place-items:center;flex:none;border:2px solid var(--ink)}
.ring b{width:62px;height:62px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--display);font-size:1.15rem;border:2px solid var(--ink)}
.play-big{width:100%;background:var(--honey);border:3px solid var(--ink);border-radius:24px;padding:18px;font-family:var(--display);font-size:2.4rem;font-weight:800;cursor:pointer;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.play-big span{font-family:var(--body);font-size:1rem;font-weight:700}
.play-big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.play-big:disabled,.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.game{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:14px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.game:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.game i{font-style:normal;font-size:2.6rem;line-height:1.1}
.game b{font-family:var(--display);font-size:1.2rem}
.game span{font-size:.9rem;color:var(--muted)}
.game small{font-weight:800;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.game.done{background:var(--paper)}
.flash{font-family:var(--display);font-size:1.3rem;font-weight:800;margin:0}
.clock{font-family:var(--display);font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums}
.hearts{font-size:1.4rem;letter-spacing:2px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:46px;height:54px;font-family:var(--display);font-size:1.7rem;font-weight:800;border:2px solid var(--ink);border-radius:12px;background:var(--honey);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.tile.used{visibility:hidden}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:56px}
.slot{min-width:38px;height:52px;border:0;border-bottom:4px solid var(--ink);background:none;font-family:var(--display);font-size:1.7rem;font-weight:800;display:grid;place-items:center}
.slot.full{cursor:pointer;background:var(--paper);border-radius:8px 8px 0 0}
.pickrow{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font:inherit;font-weight:700;background:var(--card);text-align:left;width:100%}
.pickrow.on{border-color:var(--ink);background:var(--paper)}
.pickrow .box{width:30px;height:30px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;background:var(--card);flex:none;font-weight:800}
.pickrow.on .box{background:var(--honey)}
.chip.on{background:var(--honey)}
label.inline{flex-direction:row;align-items:center;gap:6px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.shopitem{border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.shopitem.on{border-color:var(--ink);background:var(--paper)}
.big-e{font-size:2.2rem;line-height:1}
.av small{display:block;font-size:.7rem;font-weight:800}
.av:disabled{opacity:.45;cursor:not-allowed}
.prog.lv{width:100%;max-width:360px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border:2px solid var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--card);font:inherit;text-align:left}
.team.mine{background:var(--paper);box-shadow:0 0 0 3px var(--honey)}
.team.pick{cursor:pointer;align-items:center;justify-content:center;min-height:120px;box-shadow:0 4px 0 var(--ink)}
.team .tot{font-family:var(--display);font-size:1.6rem;font-weight:800}
.team ol,.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;width:100%}
.team li,.board li{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.board li.me{background:var(--paper);font-weight:800}
.board.mini{font-size:.9rem}
.vs{height:16px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;display:flex}
.vs i{display:block;height:100%}
.big-code{font-size:2.4rem;letter-spacing:.2em}
.huge{font-family:var(--display);font-size:2.6rem;font-weight:800}
.outp{opacity:.4;text-decoration:line-through}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{position:absolute;top:-40px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (max-width:420px){h1{font-size:1.5rem}.brand h1 span{font-size:1.2rem}.who{gap:6px}.stat{padding:2px 8px;font-size:.9rem}.teams{grid-template-columns:1fr}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.pop{animation:pop .25s ease-out}
@media (prefers-reduced-motion:reduce){.pop,.mascot .bee{animation:none}.btn:active,.mode:active,.speaker:active{transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const KEY = 'spellhive.v1';
const SAMPLE = ['necessary','rhythm','conscience','mischievous','pneumonia','silhouette','bureaucracy','chrysanthemum','onomatopoeia','connoisseur','fluorescent','hemorrhage','lieutenant','maneuver','questionnaire','sacrilegious','vacuum','zucchini','acquiesce','guarantee'];
const GAP = [0,0,1,2,4,7];            // days until the next review, by box
const BOXNAME = ['','Needs work','Learning','Learning','Mastered','Mastered'];
const LEVELS = [[0,'Larva'],[25,'Worker Bee'],[75,'Forager'],[150,'Guard Bee'],[300,'Queen Bee']];
const AVATARS = ['🐝','🦋','🐞','🦊','🐼','🦄','🐯','🐸'];
const BADGES = {
  first:['First Flight','Finished a first session'],
  comeback:['Comeback','Spelled a past miss correctly'],
  run10:['Hot Streak','10 correct in a row'],
  day3:['3-Day Buzz','Practiced 3 days in a row'],
  day7:['Week of Honey','Practiced 7 days in a row'],
  honey10:['Honey Maker','Mastered 10 words'],
  crown:["Queen's Crown",'Finished a Mock Bee with no misses'],
  clock20:['Speedy Bee','20 words in Beat the Clock'],
  survivor:['Survivor','15 words in Survival'],
  boss:['Boss Buster','Beat a Boss Word'],
  team:['Team Player','Joined a team league'],
  battle:['Battle Champ','Won a Live Bee Battle'],
  passwin:['Last Bee Standing','Won a Pass-and-Play Bee']
};
const SESSION_SIZE = 10, BEE_SIZE = 25;
const SIZES = [5,10,20,30,0];          // words per round; 0 means all ready words
// Cloud sync and list sharing are optional. Forks: put your own Firebase project here, or leave both empty to turn the cloud features off.
const FB = { apiKey:'AIzaSyBBFFeYYMIjdhRIXxWBUb1M1C3NCbMrHOA', projectId:'spellhive-faf11' };
const cloudOn = !!(FB.apiKey && FB.projectId);
const app = document.getElementById('app');

/* ---------- storage ---------- */
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){ saveLocal(); scheduleSync(); }
function starterList(){ return {id:'sample', name:'Tricky words starter', kind:'builtin', t:0, words:SAMPLE.slice()}; }
let S = load() || { profiles:[], lists:[starterList()], fix:{}, gone:{}, cur:null };
function migrate(){
  S.profiles = S.profiles || []; S.fix = S.fix || {}; S.gone = S.gone || {};
  if(!S.lists || !S.lists.length) S.lists = [starterList()];
  for(const l of S.lists){ if(!l.kind) l.kind = l.id==='sample' ? 'builtin' : 'own'; if(l.id==='sample') l.name = 'Tricky words starter'; }
  for(const p of S.profiles){
    p.badges = p.badges || []; p.words = p.words || {};
    // Older versions stored one list in listId. Keep it and add listIds, so no practice history or list choice is lost.
    if(!Array.isArray(p.listIds) || !p.listIds.length) p.listIds = [p.listId || S.lists[0].id];
    if(p.size == null) p.size = SESSION_SIZE;
    if(p.beeSize == null) p.beeSize = BEE_SIZE;
  }
}
migrate();
let V = { view:'profiles', avatar:AVATARS[0], msg:'', confirm:'', sync:'', defaultList:'' };
let sess = null;

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFC').trim().toLowerCase().replace(/\s+/g,' ');
// fold: what counts as the same spelling. Accents are ignored (pinata = piñata) and curly apostrophes match straight ones.
const fold = s => norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\u2018\u2019]/g,"'");
const uid = () => Math.random().toString(36).slice(2,9);
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(off){ const d = new Date(); d.setDate(d.getDate()+(off||0)); return dstr(d); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prof(){ return S.profiles.find(p => p.id===S.cur) || null; }
// A player practices every list they have ticked. Words that appear in two lists count once; progress is per word, so it is shared.
function activeLists(pl){
  const p = pl || prof(), ids = (p && p.listIds) || [];
  const ls = ids.map(id => S.lists.find(l => l.id===id)).filter(Boolean);
  return ls.length ? ls : [S.lists[0]];
}
function activeWords(pl){ const seen = new Set(), out = []; for(const l of activeLists(pl)) for(const w of l.words) if(!seen.has(w)){ seen.add(w); out.push(w); } return out; }
function listsLabel(pl){ const ls = activeLists(pl); return ls.length === 1 ? ls[0].name : ls.length + ' lists: ' + ls.map(l => l.name).join(' + '); }
function setLists(p, ids){ p.listIds = ids.length ? ids : [S.lists[0].id]; p.listId = p.listIds[0]; p.t = Date.now(); }
function cap(n){ return n > 0 ? n : Infinity; }
function level(pts){ let n = LEVELS[0][1]; for(const [min,name] of LEVELS) if(pts>=min) n = name; return n; }
/* ---------- practice log (per day, per device, so two phones never double count) ---------- */
const IDLE_CAP = 90; // seconds counted per step at most, so a phone left open does not inflate practice time
function logDay(p, d){
  if(!S.dev) S.dev = uid();
  const days = p.days || (p.days = {}), b = days[today()] || (days[today()] = {}), r = b[S.dev] || (b[S.dev] = {sec:0, ok:0, bad:0, n:0, pts:0, ts:0});

function rng(seed){ let a = 0; for(const c of seed) a = (Math.imul(a, 31) + c.charCodeAt(0)) | 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- word choice for games: hard words first, mixed with others so games stay fun ---------- */
function gameQueue(p, n){
  const b = buckets(p), words = activeWords(p);
  const hard = [...new Set(shuffle(b.miss).concat(shuffle(b.trouble)))], hs = new Set(hard);
  const rest = shuffle(words.filter(w => !hs.has(w))), mix = [];
  while(hard.length || rest.length){ if(hard.length) mix.push(hard.shift()); if(rest.length) mix.push(rest.shift()); }
  const out = [];
  for(let g=0; out.length < n && mix.length && g < 2000; g++){
    for(const w of (g ? shuffle(mix) : mix)){ if(out.length >= n) break; if(mix.length > 1 && out[out.length-1] === w) continue; out.push(w); }
  }
  return out;
}
// Same five words for everyone on the same lists, so friends can compare scores.
function dailyWords(p){ const r = rng(today()), ws = activeWords(p).slice().sort(); for(let i=ws.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [ws[i],ws[j]] = [ws[j],ws[i]]; } return ws.slice(0, DAILY_N); }
// This week's boss: the player's most-missed word that is not mastered yet.
function bossFor(p){
  const wk = weekId(), words = activeWords(p);
  if(p.boss && p.boss.wk === wk && words.includes(p.boss.w)) return p.boss;
  const open = words.filter(w => !(p.words[w] && p.words[w].box >= 4));
  const pool = open.length ? open : words;
  const score = w => { const r = p.words[w]; return (r ? r.bad*10 + (r.box===1 ? 5 : 0) : 0) + w.length/100; };
  const w = pool.slice().sort((a,b) => score(b) - score(a))[0];
  p.boss = {wk, w, hits:[]}; p.t = Date.now();
  return p.boss;
}
// Game answers count toward learning: a miss makes a word a trouble word again. A box only moves up when the word is due,
// so repeating a word inside one game cannot fake mastery.
function gameRecord(p, w, ok, typed, firstTry){
  const r = p.words[w] || (p.words[w] = {box:1,due:'',att:0,ok:0,bad:0,miss:[]});
  r.att++; r.last = today(); r.ts = Date.now(); p.t = r.ts;
  if(ok){
    r.ok++;
    if(firstTry && (!r.due || r.due <= today())){ if(r.bad > 0) award('comeback', p); r.box = Math.min(5, r.box+1); r.due = today(GAP[r.box]); }
  } else {
    r.bad++; r.box = 1; r.due = today();
    const a = norm(typed); if(a && !r.miss.includes(a)){ r.miss.unshift(a); r.miss = r.miss.slice(0,5); }
  }
}

/* ---------- sessions ---------- */
function startSession(mode){
  const b = buckets(), words = activeWords(), p = prof(), n = cap(p.size);
  let q;
  if(mode==='trouble') q = shuffle(b.trouble).slice(0, n);
  else if(mode==='bee') q = shuffle(words).slice(0, cap(p.beeSize));
  else {
    // Same order as before: missed words first, then words due for review, then new words. Only the round size is now a choice.
    q = shuffle(b.miss).concat(shuffle(b.due), b.fresh).slice(0, n);
    if(!q.length) q = words.slice().sort((x,y) => p.words[x].box - p.words[y].box).slice(0, n);
  }
  if(!q.length){ V.msg = mode==='trouble' ? 'No trouble words right now. Nice work!' : 'These lists have no words yet. Tap Change to pick another list.'; render(); return; }
  begin(mode, q);
}
function startGame(mode){
  const p = prof();
  if(!activeWords().length){ V.msg = 'Pick a word list with words first.'; render(); return; }
  let q, extra = {};
  if(mode==='clock'){ q = gameQueue(p, 400); extra = {endAt:0}; }
  else if(mode==='survival'){ q = gameQueue(p, 500); extra = {lives:LIVES}; }
  else if(mode==='unscramble') q = gameQueue(p, Math.min(cap(p.size), activeWords().length));
  else if(mode==='daily'){
    if(p.daily && p.daily.day === today()){ V.msg = 'You already played Daily Honey today. Come back tomorrow for 5 new words!'; render(); return; }
    q = dailyWords(p);
  } else if(mode==='boss'){
    const b = bossFor(p);
    if(b.hits.length >= BOSS_HITS){ V.msg = 'You beat this week’s Boss Word! A new boss arrives on Monday.'; render(); return; }
    if(b.hits.includes(today())){ V.msg = 'You hit the boss today. Come back tomorrow to hit it again!'; render(); return; }
    q = [b.w]; save();
  }
  begin(mode, q, extra);
}
function begin(mode, q, extra){

  if(mode==='clock'){ sess.endAt = Date.now() + CLOCK_SEC*1000; startClock(); }

  render();

}
function award(id, pl){ const p = pl || prof(); if(!p.badges.includes(id)){ p.badges.push(id); if(sess && (!pl || pl === prof())) sess.newBadges.push(id); } }
function submit(){
  if(!sess) return;
  if(sess.mode === 'pass') checkPass();

  else if(MODES[sess.mode].lite) checkLite();

}
function check(){
  const it = sess.q[sess.i], w = it.w, a = norm(sess.attempt);
  if(!a) return;
  const p = prof();
  const r = p.words[w] || (p.words[w] = {box:1,due:'',att:0,ok:0,bad:0,miss:[]});
  r.att++; r.last = today(); r.ts = Date.now(); p.t = r.ts;
  if(fold(a) === fold(w)){
    r.ok++;
    if(!it.retry){
      if(r.bad>0) award('comeback');
      r.box = Math.min(5, r.box+1); r.due = today(GAP[r.box]); sess.right++;
    }
    addPts(p, 1); sess.pts++; sess.run++; logDay(p, {sec:tick(), ok:it.retry?0:1});
    if(sess.run>=10) award('run10');
    if(sess.mode==='boss' && !it.retry) bossHit(p);
    sess.stage = 'right';
    sayTok++; quiet(); snd('ok'); tts('Correct!');
  } else {
    r.bad++; r.box = 1; r.due = today(); logDay(p, {sec:tick(), bad:1});
    if(!r.miss.includes(a)){ r.miss.unshift(a); r.miss = r.miss.slice(0,5); }
    sess.run = 0; sess.last = a; sess.tries[w] = (sess.tries[w]||0) + 1;
    if(!sess.missed.includes(w)) sess.missed.push(w);
    if(sess.mode==='bee') sess.out = true;
    else if(sess.mode!=='boss') sess.q.splice(Math.min(sess.q.length, sess.i+3), 0, {w, retry:true});

}
function bossHit(p){
  const b = p.boss; if(!b || b.hits.includes(today())) return;
  b.hits.push(today()); addPts(p, 5); sess.pts += 5; sess.bossHit = true;
  if(b.hits.length >= BOSS_HITS){ award('boss'); addPts(p, 20); sess.pts += 20; sess.bossBeaten = true; }
}
function checkCover(){
  const w = sess.q[sess.i].w;
  if(!norm(sess.attempt)) return;
  logDay(prof(), {sec:tick()}); prof().t = Date.now();
  if(fold(sess.attempt) === fold(w)){ next(); }
  else { sess.last = norm(sess.attempt); sess.tries[w] = (sess.tries[w]||0) + 1; sess.attempt=''; sess.coverFail = true; sess.stage='study'; render(); }

function next(){

/* fast games: a right answer moves straight on, a miss shows the correct spelling before going on */
function checkLite(){

    sess.right++; sess.run++;

function finish(){

/* ---------- meaning games: Meaning Match, Clue Bee, Fill the Sentence ---------- */
function mStart(mode){

  if(mode !== 'mclue' && all.length < 4){ V.msg = `This game needs at least 4 words with meanings. Your lists have ${all.length}. Try Clue Bee.`; render(); return; }
  const q = mQueue(p, Math.min(cap(p.size), all.length), mode === 'mfill' ? hasBlank : null);
  if(!q.length){ V.msg = 'None of these words have an example sentence yet. Try Meaning Match or Clue Bee.'; render(); return; }
  V.msg = ''; stopClock();
  sess = {mode, q:q.map(w => ({w, retry:false})), i:0, pts:0, stars:0, right:0, wrong:0, missed:[], run:0, stage:'ask', attempt:'', panel:null, newBadges:[], tries:{}, mark:Date.now(), flash:'', last:''};
  mSetup(); V.view = 'play'; render(); mSay();
}
function mSetup(){
  const w = sess.q[sess.i].w, pool = shuffle(mWords(prof()).filter(x => x !== w)), picks = [], seen = new Set([sess.mode === 'mmatch' ? meaningOf(w) : w]);
  sess.attempt = ''; sess.panel = null; sess.last = '';
  if(sess.mode === 'mclue'){ sess.choices = null; return; }

function mSay(){

function mCheck(ans){

function mNext(){

/* ---------- pass-and-play bee: one phone, take turns, a miss is out ---------- */
function startPass(){
  const ps = V.pass.sel.map(id => S.profiles.find(p => p.id===id)).filter(Boolean).map(p => ({name:p.name, avatar:p.avatar, pid:p.id}))
    .concat(V.pass.guests.map(g => ({name:g.name, avatar:g.avatar, pid:null})));
  if(ps.length < 2){ V.msg = 'Pick at least 2 spellers.'; render(); return; }
  const words = shuffle(activeWords());
  if(!words.length){ V.msg = 'Pick a word list with words first.'; render(); return; }
  stopClock(); V.msg = '';
  sess = { mode:'pass', players:ps.map(x => Object.assign(x, {alive:true, right:0})), order:ps.map((x,i) => i), ti:0, round:1, roundMiss:[], q:words.map(w => ({w})), i:0,
    stage:'pass', attempt:'', note:'', pts:0, right:0, missed:[], newBadges:[], tries:{}, mark:Date.now() };
  V.view = 'play'; render();
}
function passWord(){ return sess.q[sess.i % sess.q.length].w; }
function passPlayer(){ return sess.players[sess.order[sess.ti]]; }
function checkPass(){
  const w = passWord(), a = norm(sess.attempt);
  if(!a) return;
  const pl = passPlayer(), ok = fold(a) === fold(w), p = pl.pid && S.profiles.find(x => x.id===pl.pid);
  if(p){ gameRecord(p, w, ok, a, true); if(ok) addPts(p, 1); }
  if(ok) pl.right++; else sess.roundMiss.push(sess.order[sess.ti]);
  sess.verdict = {ok, w, a}; sess.attempt = ''; sess.stage = 'verdict';
  sayTok++; quiet(); snd(ok ? 'ok' : 'bad');
  save(); render();
}
function passNext(){
  sess.i++; sess.ti++;
  if(sess.i % sess.q.length === 0) sess.q = shuffle(sess.q);
  if(sess.ti < sess.order.length){ sess.stage = 'pass'; sess.note = ''; render(); return; }
  // End of a round. Like a real bee: if every speller still in missed, they all stay in.
  const order = sess.order, miss = sess.roundMiss;
  if(miss.length && miss.length === order.length && order.length > 1) sess.note = 'Everyone missed this round, so everyone stays in!';
  else if(miss.length){ for(const i of miss) sess.players[i].alive = false; sess.note = miss.map(i => sess.players[i].name).join(' and ') + (miss.length===1 ? ' is' : ' are') + ' out this round.'; }
  else sess.note = 'Everyone spelled their word. Next round!';
  const alive = sess.players.map((x,i) => i).filter(i => sess.players[i].alive);
  if(alive.length <= 1 || sess.round >= 30){ finishPass(); return; }
  sess.order = alive; sess.ti = 0; sess.round++; sess.roundMiss = []; sess.stage = 'pass'; render();
}
function finishPass(){
  const win = sess.players.filter(x => x.alive);
  sess.winners = win;
  if(win.length === 1){
    const p = win[0].pid && S.profiles.find(x => x.id===win[0].pid);
    if(p){ addPts(p, 5); award('passwin', p); p.t = Date.now(); }
  }
  sess.stage = 'done'; quiet(); save(); render(); confetti(); snd('win');
  for(const x of sess.players){ const p = x.pid && S.profiles.find(y => y.id===x.pid); if(p) leaguePush(p); }
}

/* ---------- team league (cloud): kids join with a code and pick a team; weekly honey adds up per team ---------- */
const TEAM_NAMES = ['🐝 Bees','🦋 Butterflies'];
function decodeDoc(doc){ const o = {members:{}}; for(const k in doc || {}){ if(k.startsWith('m_') || k.startsWith('p_')){ try{ o.members[k.slice(2)] = JSON.parse(doc[k]); }catch(e){} } else o[k] = doc[k]; } return o; }
function memberEntry(p){
  return JSON.stringify({n:p.name, a:p.avatar, h:p.hat||'', tm:p.league.team, wk:weekId(), wp:weekPts(p,0), lw:weekId(-1), lp:weekPts(p,-1), tp:p.points,
    dd:(p.daily && p.daily.day) || '', ds:(p.daily && p.daily.s) || 0, ts:Date.now()});
}
async function leaguePush(p){
  if(!cloudOn || !p || !p.league) return;
  const key = 'm_' + p.id;
  try{ await cloudPatch('leagues', p.league.code, {[key]:memberEntry(p)}, {mask:[key], exists:true}); }catch(e){}
}
async function loadLeague(){
  const p = prof();
  if(!cloudOn || !p || !p.league){ V.league = null; return; }
  V.league = Object.assign(V.league || {}, {loading:true}); render();
  try{
    await leaguePush(p);
    const doc = await cloudGet('leagues', p.league.code);
    V.league = doc ? {doc:decodeDoc(doc), at:Date.now()} : {gone:true};
  }catch(e){ V.league = {err:cloudErr(e)}; }
  if(V.view === 'team') render();
}
function teamScores(L){
  const wk = weekId(), lw = weekId(-1), t = [{pts:0, last:0, kids:[]}, {pts:0, last:0, kids:[]}];
  for(const id in L.members){
    const m = L.members[id], side = t[m.tm === 1 ? 1 : 0];
    const now = m.wk === wk ? m.wp : 0, last = m.wk === lw ? m.wp : m.lw === lw ? m.lp : 0;
    side.pts += now; side.last += last; side.kids.push(Object.assign({id, now}, m));
  }
  for(const s of t) s.kids.sort((a,b) => b.now - a.now);
  return t;
}
async function leagueCreate(){

/* ---------- live bee battle (cloud): everyone gets the same words at the same time ---------- */
let roomTimer = null;
function roomCode(){ const a = new Uint32Array(5); crypto.getRandomValues(a); let c = ''; for(const n of a) c += ALPHA[n % ALPHA.length]; return c; }
function stopRoom(){ clearInterval(roomTimer); roomTimer = null; }
function pollRoom(ms){ stopRoom(); roomTimer = setInterval(refreshRoom, ms || 2000); }
async function roomNew(){
  const p = prof(), words = shuffle(activeWords()).slice(0, BATTLE_N);
  if(!words.length){ V.msg = 'Pick a word list with words first.'; render(); return; }
  busy();
  try{
    let code = roomCode();
    for(let i=0; i<3 && await cloudGet('rooms', code); i++) code = roomCode();
    await cloudPatch('rooms', code, {host:p.id, hn:p.name, words:JSON.stringify(words), state:'lobby', created:Date.now(), start:0}, {exists:false});
    await roomEnter(code, p);
  }catch(e){ V.msg = cloudErr(e); render(); }
}
async function roomJoin(raw){
  const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(code.length !== 5){ V.msg = 'A battle code has 5 letters and numbers. Check it and try again.'; render(); return; }
  busy();
  try{
    const doc = await cloudGet('rooms', code), p = prof();
    if(!doc){ V.msg = 'No battle uses that code. Check it and try again.'; render(); return; }
    if(doc.state !== 'lobby' && !doc['p_'+p.id]){ V.msg = 'That battle has already started. Ask for a new code.'; render(); return; }
    await roomEnter(code, p);
  }catch(e){ V.msg = cloudErr(e); render(); }
}
async function roomEnter(code, p){
  const key = 'p_' + p.id;
  await cloudPatch('rooms', code, {[key]:JSON.stringify({n:p.name, a:p.avatar, s:0, c:0, i:0, done:false, ts:Date.now()})}, {mask:[key], exists:true});
  V.room = {code, doc:null}; V.msg = ''; V.view = 'battle';
  await refreshRoom(); pollRoom(2000);
}
async function refreshRoom(){
  if(!V.room) return stopRoom();
  let doc;
  try{ doc = await cloudGet('rooms', V.room.code); }catch(e){ return; }
  if(!doc || !V.room) return;
  V.room.doc = decodeDoc(doc);
  const R = V.room.doc;
  if(R.state === 'play' && !(sess && sess.mode === 'battle') && !V.room.played){
    V.room.played = true;
    let words = []; try{ words = JSON.parse(R.words); }catch(e){}
    begin('battle', words, {score:0, room:V.room.code});
    pollRoom(3000);
    return;
  }
  const board = document.getElementById('board');
  if(board && sess && sess.mode === 'battle') board.innerHTML = boardHTML(R, sess.stage !== 'done');
  else if(V.view === 'battle') render();
  if(sess && sess.mode === 'battle' && sess.stage === 'done'){
    const kids = Object.values(R.members);
    if(kids.length && kids.every(k => k.done)){
      stopRoom();
      const p = prof(), me = R.members[p.id], top = Math.max(...kids.map(k => k.s));
      if(kids.length > 1 && me && me.s === top && top > 0 && !sess.battleWon){ sess.battleWon = true; award('battle'); save(); confetti(); snd('win'); }
      sess.allDone = true; render();
    }
  }
}
function battlePush(done){
  if(!sess || !sess.room) return;
  const p = prof(), key = 'p_' + p.id;
  cloudPatch('rooms', sess.room, {[key]:JSON.stringify({n:p.name, a:p.avatar, s:sess.score, c:sess.right, i:sess.i+1, done:!!done, ts:Date.now()})}, {mask:[key], exists:true}).catch(() => {});
}
async function roomStart(){
  if(!V.room) return;
  busy();
  try{ await cloudPatch('rooms', V.room.code, {state:'play', start:Date.now()}, {mask:['state','start'], exists:true}); await refreshRoom(); }
  catch(e){ V.msg = cloudErr(e); render(); }
}
function boardHTML(R, mini){
  const n = (() => { try{ return JSON.parse(R.words).length; }catch(e){ return BATTLE_N; } })();
  const kids = Object.entries(R.members).map(([id, m]) => Object.assign({id}, m)).sort((a,b) => b.s - a.s || b.c - a.c);
  const me = prof() && prof().id, medal = ['🥇','🥈','🥉'];
  return `<ol class="board ${mini?'mini':''}">${kids.map((k,i) => `<li class="${k.id===me?'me':''}"><span>${medal[i]||''} ${esc(k.a)} ${esc(k.n)}</span><span>${k.done ? '✅' : `${k.i||0}/${n}`}</span><b>${k.s}</b></li>`).join('')}</ol>`;
}

  wear(t){ const p = prof(); p.hat = t.dataset.id; p.t = Date.now(); save(); render(); },
  setav(t){ const p = prof(); p.avatar = t.dataset.id; p.t = Date.now(); save(); render(); },
  gatecheck(){ const v = +document.getElementById('gate-n').value; if(v === V.gate.a * V.gate.b){ V.gateOK = true; V.view = 'parent'; V.msg = ''; } else V.msg = 'That’s not it. Ask a grown-up!'; render(); },
  leaguenew(){ leagueCreate(); },
  leaguejoin(){ leagueJoin(document.getElementById('team-code').value); },
  teampick(t){ pickTeam(+t.dataset.i); },
  teamcancel(){ V.pickTeam = null; V.msg = ''; render(); },
  teamswitch(){
    const p = prof(), L = V.league && V.league.doc;
    if(!L) return;
    if(p.league.sw === weekId()){ V.msg = 'You already switched teams this week. You can switch again next week.'; render(); return; }
    V.pickTeam = {code:p.league.code, doc:L}; V.msg = 'You can switch once a week. Your honey this week moves with you.'; render();
  },
  leagueleave(){ twoStep('leave', () => { leagueLeave(); }); },
  leaguerefresh(){ loadLeague(); },
  roomnew(){ roomNew(); },
  roomjoin(){ roomJoin(document.getElementById('room-code').value); },
  roomstart(){ roomStart(); },
  roomleave(){ stopRoom(); V.room = null; V.msg = ''; V.view = 'games'; render(); },
  addlist(){
    const name = document.getElementById('list-name').value.trim(), words = parseWords(document.getElementById('list-words').value);
    if(!words.length){ V.msg = 'Type or paste at least one word before saving the list.'; render(); return; }
    const l = {id:uid(), name:name || 'My word list', kind:'own', t:Date.now(), words}, p = prof();
    S.lists.push(l); setLists(p, activeLists().map(x => x.id).concat(l.id)); p.t = l.t;
    V.msg = `Saved “${l.name}” with ${words.length} words and ticked it.` + (cloudOn ? ' To share it with other families, open the grown-ups area.' : '');
    save(); render();
  },
  dellist(t){ const id = t.dataset.id; twoStep('list:'+id, () => { S.gone[id] = Date.now(); S.lists = S.lists.filter(l => l.id!==id); for(const p of S.profiles) if(p.listIds.includes(id)) setLists(p, p.listIds.filter(x => x !== id && S.lists.some(l => l.id === x))); V.msg = 'List deleted.'; save(); render(); }); },
  async sharelist(t){
    const l = S.lists.find(x => x.id === t.dataset.id); if(!l) return;
    busy();
    try{
      const code = newCode(), means = meansForList(l), n = Object.keys(means).length, again = !!l.code, doc = {name:l.name, words:JSON.stringify(l.words), updated:Date.now()};
      if(n) doc.means = JSON.stringify(means);
      await cloudPut('lists', code, doc, true);
      l.code = code; l.t = Date.now(); if(n) l.means = means;
      V.msg = again ? `New list code for “${l.name}” with ${plural(n, 'meaning')}. Send it to families who want the meanings. The old code still works, without them.`
        : `“${l.name}” is shared${n ? ` with ${plural(n, 'meaning')}` : ''}. Send the list code or link to other families.`;
      save();
    }catch(e){ V.msg = /403/.test(String(e && e.message)) && meansForList(l) && Object.keys(meansForList(l)).length ? 'Sharing with meanings needs the updated Firebase rules. Publish firestore.rules from the repository in the Firebase console, then try again.' : cloudErr(e); }
    render();
  },
  async joinlist(){
    const code = cleanCode(document.getElementById('list-code').value);
    if(code.length !== 8){ V.msg = 'A list code has 8 letters and numbers after LIST. Check it and try again.'; render(); return; }
    busy(); await addSharedList(code); render();
  },
  async copy(t){
    try{ await navigator.clipboard.writeText(t.dataset.text); V.msg = 'Copied: ' + t.dataset.text; }
    catch(e){ V.msg = 'Copy was blocked. Copy it by hand: ' + t.dataset.text; }
    render();
  },
  async syncon(){
    busy();
    try{
      let code = newCode();
      for(let i=0; i<3 && await cloudGet('hives', code); i++) code = newCode();
      await cloudPut('hives', code, {data:payload(), updated:Date.now()});
      S.sync = {code}; V.sync = 'ok'; V.msg = 'Sync is on. Enter the family code on your other phones.';
      saveLocal();
    }catch(e){ V.msg = cloudErr(e); }
    render();
  },
  syncjoin(){ joinFamily(document.getElementById('join-code').value); },
  joinmode(t){ joinFamily(V.join.code, t.dataset.m); },
  joincancel(){ V.join = null; V.msg = ''; render(); },
  async syncnow(){ await syncNow(); V.msg = V.sync==='ok' ? 'Synced.' : 'Sync did not finish. Check the internet connection and try again.'; render(); },
  syncoff(){ twoStep('syncoff', () => { delete S.sync; V.sync = ''; V.msg = 'Sync is off on this phone. Everything stays saved here.'; saveLocal(); render(); }); },
  reset(){ twoStep('reset', () => { const p = prof(); p.resetAt = p.t = Date.now(); p.words={}; p.days={}; p.points=0; p.streak=0; p.lastDay=''; p.badges=[]; p.spent=0; p.owned=[]; p.hat=''; p.best={}; p.daily=null; p.boss=null; p.mw={}; p.stars=0; V.msg='Progress erased.'; save(); render(); }); },
  remove(){ twoStep('remove', () => { S.gone[S.cur] = Date.now(); S.profiles = S.profiles.filter(p => p.id!==S.cur); S.cur=null; V.view='profiles'; save(); render(); }); },
  mkbackup(){ document.getElementById('backup').value = JSON.stringify(S); },
  async copybackup(){
    const ta = document.getElementById('backup'); if(!ta.value) ta.value = JSON.stringify(S);
    try{ await navigator.clipboard.writeText(ta.value); V.msg='Backup copied.'; }catch(e){ ta.select(); V.msg='Copy was blocked. The text is selected, so press Ctrl+C or Cmd+C.'; return; }
    const keep = ta.value; render(); document.getElementById('backup').value = keep;
  },
  dlbackup(){
    try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'})); a.download = 'spellhive-backup-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  },
  restore(){
    try{
      const o = JSON.parse(document.getElementById('backup').value);
      if(!o || !Array.isArray(o.profiles) || !Array.isArray(o.lists) || !o.lists.length) throw 0;
      S = o; migrate(); if(!prof()) S.cur = S.profiles.length ? S.profiles[0].id : null;
      V.msg = 'Backup restored.'; save();
    }catch(e){ V.msg = 'That text is not a SpellHive backup. Paste the full backup and try again.'; }
    render();
  }
};
function refocus(){ const f = document.getElementById('answer'); if(f) f.focus(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || t.disabled) return;
  if(V.confirm && !['dellist','reset','remove','syncoff','leagueleave'].includes(t.dataset.act)) V.confirm = '';
  ACT[t.dataset.act](t);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.id !== 'add-player') return;
  const name = document.getElementById('new-name').value.trim();
  if(!name) { document.getElementById('new-name').focus(); return; }
  const lid = V.defaultList || S.lists[0].id;
  const p = {id:uid(), name, avatar:V.avatar, points:0, streak:0, lastDay:'', badges:[], listId:lid, listIds:[lid], size:SESSION_SIZE, beeSize:BEE_SIZE, words:{}, t:Date.now()};
  S.profiles.push(p); S.cur = p.id; V.view='home'; save(); render();
  if(V.pendingTeam){ const c = V.pendingTeam; V.pendingTeam = ''; leagueJoin(c); }
});
document.addEventListener('input', e => { if(e.target.id==='answer' && sess) sess.attempt = e.target.value; });
document.addEventListener('keydown', e => {
  if(e.key!=='Enter' || e.repeat) return;
  const t = e.target;
  if(t.id==='answer' && sess){
    e.preventDefault();
    if(sess.stage==='ask') submit(); else if(sess.stage==='cover') checkCover();
    return;
  }
  if(t.dataset && t.dataset.enter){ e.preventDefault(); ACT[t.dataset.enter](t); }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.chg;
  if(k==='size'){ const n = Math.round(+t.value); if(n >= 1){ const p = prof(); p.size = Math.min(500, n); p.t = Date.now(); save(); render(); } }
  else if(k==='fix'){
    const w = t.dataset.w, v = t.value.trim(), f = S.fix[w] || (S.fix[w] = {});
    if(v) f[t.dataset.k] = v; else delete f[t.dataset.k];
    f.t = Date.now();
    save();
  }
  else if(k==='mfile' && t.files[0]){ t.files[0].text().then(txt => { document.getElementById('mean-import').value = txt; }); }
  else if(k==='file' && t.files[0]){ t.files[0].text().then(txt => { document.getElementById('backup').value = txt; }); }
});

if(prof()) V.view = 'home';
render();
window.addEventListener('online', () => syncNow());
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && !sess) syncNow(); });
(async () => {
  const m = location.hash.match(/^#list-([A-Za-z0-9]+)$/), tm = location.hash.match(/^#team-([A-Za-z0-9]+)$/);
  if(m && cloudOn){ await addSharedList(cleanCode(m[1])); render(); }
  if(tm && cloudOn){ if(prof()) await leagueJoin(tm[1]); else { V.pendingTeam = tm[1]; V.msg = 'Add your name first, then pick your team.'; render(); } }
  syncNow();
})();
</script>
</body>
</html>
